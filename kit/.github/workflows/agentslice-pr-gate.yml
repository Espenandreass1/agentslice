name: AgentSlice PR lane gate

on:
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-lane:
    name: Verify AgentSlice lane
    runs-on: ubuntu-latest
    steps:
      # pull_request_target checks out the trusted base ref, never PR code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });
            const policy = JSON.parse(require('fs').readFileSync('agentslice.policy.json', 'utf8'));
            const gate = await import(`file://${process.env.GITHUB_WORKSPACE}/.github/agentslice/verify-pr-lane.mjs`);
            const result = gate.verifyPullRequest({
              body: context.payload.pull_request.body ?? '',
              files: files.map(file => file.filename),
              policy,
            });
            await core.summary
              .addHeading('AgentSlice lane gate')
              .addRaw(result.ok ? `Lane: **${result.lane}**` : result.errors.map(error => `- ${error}`).join('\n'))
              .write();
            if (!result.ok) core.setFailed(result.errors.join('\n'));
