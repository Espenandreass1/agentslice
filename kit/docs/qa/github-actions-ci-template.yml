# Optional stack-specific CI starter.
# The AgentSlice lane gate is installed separately and validates classification.
# This starter intentionally skips docs-only PRs and does not make a full suite
# or build the default. Replace the example commands with project-specific,
# risk-aware checks before enabling it.

name: Project CI

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  node-baseline:
    if: >-
      hashFiles('package.json') != '' &&
      !contains(github.event.pull_request.body, '<!-- agentslice:lane=docs -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      # Add a focused command, for example:
      # npm run test:affected --if-present
      # Add the full suite/build only in a project-specific job that is gated
      # by the policy-sensitive risk trigger and documented in the PR.

  python-baseline:
    if: >-
      (hashFiles('pyproject.toml', 'requirements.txt') != '') &&
      !contains(github.event.pull_request.body, '<!-- agentslice:lane=docs -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
      # Add a focused pytest selector for the changed domain here.
